server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Genkai rename, 30 Aug 2026 -------------------------------
    # /headroom/ and anything under it -> /genkai/, permanent.
    # Path is preserved, so /headroom/foo.pdf lands on /genkai/foo.pdf.
    location = /headroom  { return 301 /genkai/; }
    location ^~ /headroom/ {
        rewrite ^/headroom/?$        /genkai/     permanent;
        rewrite ^/headroom/(.*)$     /genkai/$1   permanent;
    }
    # ---------------------------------------------------------------

    # Root-level gated dashboards are untouched and keep working:
    #   /watch-7529bb.html  /watch-261fb2.html  /demo-8a2073.html

    location / {
        try_files $uri $uri/ =404;
    }

    # Long cache for static assets, none for html
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff2?|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}

